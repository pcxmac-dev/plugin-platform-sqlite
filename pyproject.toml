[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-sqlite"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "SQLite for Liminal: the data folder's SQLite files as an instance of their own, with new files and files elsewhere beside it, each shared with another system's suite as you set it."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the database kind and its instances: liminal_libs.storage.databases, plugin API 2.3; a platform plugin of the Databases section since 1.90.0; the link's helper keeps to the shares since the same release)
dependencies = ["liminal-libs>=1.90.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
sqlite = "plugin_platform_sqlite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
